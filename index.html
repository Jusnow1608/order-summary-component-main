<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@500;700;900&display=swap"
    rel="stylesheet">

  <title>Frontend Mentor | Order summary card</title>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: "Red Hat Display", sans-serif;
      color: hsl(224, 23%, 55%);
      font-size: 1rem;
      background-image: url("images/pattern-background-desktop.svg");
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px dashed hsl(245, 75%, 52%);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .payment-button:focus-visible {
      border-radius: 10px;
    }

    .pricing-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 40px 20px 20px 20px;
      flex: 1;
      /* Elastycznie wypełnia przestrzeń bez blokowania wysokości na sztywne 100vh */
    }

    .pricing-plan {
      flex: 1;
      max-width: 450px;
      width: 100%;
      padding: 0;
      background-color: white;
      border-radius: 20px;
      text-align: center;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 20px;
    }

    .plan-image {
      object-fit: cover;
      height: 230px;
      width: 100%;
      display: block;
    }

    .card-body {
      padding: 10px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .plan-title {
      font-size: 1.75rem;
      font-weight: 900;
      color: hsl(223, 47%, 23%);
      margin: 0;
    }

    .plan-description {
      margin: 0 10px;
      line-height: 25px;
    }

    .plan-details {
      display: flex;
      align-items: center;
      background-color: hsl(225, 100%, 98%);
      border-radius: 15px;
      width: 100%;
      padding: 20px;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 15px;
    }

    .plan-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .plan-features {
      line-height: 28px;
    }

    .plan-type {
      font-weight: 900;
      color: hsl(223, 47%, 23%);
      font-size: 1rem;
    }

    .plan-price {
      color: hsl(224, 23%, 55%);
      font-size: 1.0625rem;
    }

    .change-link a {
      font-weight: 700;
      font-size: 0.875rem;
      color: hsl(245, 75%, 52%);
    }

    .change-link a:hover {
      text-decoration: none;
      color: hsl(245, 83%, 68%);
      font-weight: 700;
    }

    .payment-button {
      border-radius: 10px;
      width: 100%;
      padding: 16px;
      border: .5px solid hsl(223, 47%, 23%);
      color: white;
      background-color: hsl(245, 75%, 52%);
      font-weight: 700;
      margin-top: 10px;
      font-size: 0.9375rem;
      cursor: pointer;
      box-shadow: 0 20px 20px 0 rgba(56, 41, 224, 0.2);
    }

    .payment-button:hover {
      background-color: hsl(245, 83%, 68%);
      border: .5px solid hsl(245, 47%, 62%);
      box-shadow: 0 10px 15px 0 rgba(56, 41, 224, 0.3);
    }

    .cancel-link {
      margin-bottom: 30px;
      padding: 10px;
      margin-left: auto;
      margin-right: auto;
    }

    .cancel-link a {
      color: hsl(224, 23%, 55%);
      font-weight: 700;
      font-size: 0.9375rem;
      text-decoration: none;
    }

    .cancel-link a:hover {
      color: hsl(223, 47%, 23%);
    }

    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      padding: 10px 0;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    @media (max-width: 400px) {
      .pricing-container {
        padding: 24px 16px;
      }

      .pricing-plan {
        max-width: 327px;
        width: 100%;
      }

      .plan-image {
        height: 160px;
        width: 100%;
        object-fit: cover;
        display: block;
      }

      .card-body {
        padding: 24px 24px 32px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .plan-title {
        font-size: 1.375rem;
      }

      .plan-description {
        font-size: 0.9375rem;
        line-height: 25px;
      }

      .plan-details {
        padding: 12px 16px;
        gap: 8px;
      }

      .plan-box {
        gap: 12px;
      }

      .plan-features {
        line-height: 24px;
      }

      .plan-type {
        font-size: 0.875rem;
      }

      .plan-price {
        font-size: 1rem;
      }

      .change-link a {
        font-size: 0.875rem;
      }

      .payment-button {
        padding: 14px;
        margin-top: 8px;
      }

      .cancel-link {
        margin-bottom: 0;
        padding: 8px;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="pricing-container">
    <div class="pricing-plan">
      <img class="plan-image" src="images/illustration-hero.svg" alt="Hero illustration">

      <div class="card-body">
        <h1 class="plan-title">Order Summary</h1>
        <p class="plan-description">You can now listen to millions of songs, audiobooks, and podcasts on any
          device anywhere you like!</p>

        <div class="plan-details">
          <div class="plan-box">
            <img class="plan-icon" src="images/icon-music.svg" alt="" aria-hidden="true">
            <div class="plan-features">
              <div class="plan-type">Annual Plan</div>
              <div class="plan-price">$59.99/year</div>
            </div>
          </div>
          <div class="change-link">
            <a href="#">Change</a>
          </div>
        </div>

        <button class="payment-button">Proceed to Payment</button>
        <div class="cancel-link">
          <a href="#">Cancel Order</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Justyna Nowak-Szrajnert</a>.
  </footer>
</body>

</html>
